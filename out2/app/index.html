<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <h1>Vice City<br>Cover Maker</h1>
    <p class="tagline">Your photo + a caption, made into a multi-panel poster cover. Fully offline — photos never leave your machine.</p>

    <fieldset>
      <legend>Photos</legend>
      <label class="file">Add your photos
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <button id="samples" type="button">Or try the sample photos</button>
      <p class="hint">Click a panel on the cover to select it, drag it to position the photo, scroll to zoom.</p>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layouts">
        <button type="button" data-layout="split2">Split 2</button>
        <button type="button" data-layout="split3">Split 3</button>
        <button type="button" data-layout="grid4">Grid 4</button>
        <button type="button" data-layout="full">Full-bleed</button>
      </div>
      <div class="row" id="panels" aria-label="Select a panel">
        <button type="button">Panel 1</button>
        <button type="button">Panel 2</button>
        <button type="button">Panel 3</button>
        <button type="button">Panel 4</button>
      </div>
      <label>Photo in selected panel
        <select id="panelPhoto"></select>
      </label>
      <label>Zoom <span id="zoomLabel">100%</span>
        <input id="zoom" type="range" min="100" max="400" value="100">
      </label>
      <button id="fit" type="button">Reset crop</button>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title <input id="title" type="text" maxlength="30" value="VICE CITY"></label>
      <label>Subtitle <input id="sub" type="text" maxlength="40" value="A SUNSET HEIST"></label>
      <label>Title size <span id="titleSizeLabel">100%</span>
        <input id="titleSize" type="range" min="60" max="140" value="100">
      </label>
      <label>Title position
        <select id="titlePos">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label>Title colour
        <select id="titleColor">
          <option value="#ffffff">White</option>
          <option value="#ffd319">Sunset yellow</option>
          <option value="#00e5ff">Neon cyan</option>
          <option value="#ff2e88">Neon pink</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Grade &amp; finish</legend>
      <div class="row" id="grades">
        <button type="button" data-grade="sunset">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="duotone">Duotone</button>
      </div>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <label>Post size
        <select id="size">
          <option value="1080x1080">Square · 1080 × 1080</option>
          <option value="1080x1350">Portrait · 1080 × 1350</option>
          <option value="1920x1080">Landscape · 1920 × 1080</option>
        </select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="Live preview of the cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
